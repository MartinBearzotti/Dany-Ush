<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DANY-USH | Directos, videos y reels</title>
  <meta name="description" content="Página oficial de DANY-USH: directos de Kick, videos de YouTube y reels de TikTok en un solo lugar.">
  <meta name="theme-color" content="#0d0518">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="DANY-USH | Directos, videos y reels">
  <meta property="og:description" content="Directos de Kick, videos de YouTube y reels de TikTok en un solo lugar.">
  <!-- Cambiá TU-DOMINIO por la URL final (ej: danyush.vercel.app) -->
  <meta property="og:image" content="https://TU-DOMINIO/img/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)}</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <a class="logo" href="#"><img src="img/logo.png" alt=""><span>DANY-USH</span></a>
    <nav><a href="#ultimo">Lo último</a><a href="#kick">Kick</a><a href="#youtube">YouTube</a><a href="#tiktok">TikTok</a><a href="#contacto">Contacto</a></nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <img class="hero-logo" src="img/logo.png" alt="Logo de DANY-USH">
        <h1 id="nombre"></h1>
        <p id="tagline"></p>
        <div class="proximo" id="proximo"></div>
        <div class="hero-actions">
          <button class="btn primary" id="btn-directo" type="button">Ver el directo</button>
          <a class="btn" id="link-kick" target="_blank" rel="noopener">Seguir en Kick</a>
        </div>
      </div>
      <button class="poster wide hero-poster" id="poster-kick" type="button" aria-label="Reproducir directo de Kick">
        <span class="badge" id="badge-kick">Kick</span>
        <span class="play"></span>
        <span class="poster-title" id="titulo-kick">Directo en Kick</span>
      </button>
    </section>

    <section class="row" id="ultimo">
      <div class="row-head"><h2>Lo último</h2><div class="chips" id="chips"></div></div>
      <div class="grid" id="grid"></div>
      <div class="mas-wrap"><button class="btn" id="mas" type="button" hidden>Ver más</button></div>
    </section>

    <section class="row" id="kick">
      <div class="row-head"><h2>Streams anteriores</h2><a id="link-kick2" target="_blank" rel="noopener">Ver canal</a></div>
      <div class="rail" id="rail-kick"></div>
    </section>

    <section class="row" id="youtube">
      <div class="row-head"><h2>Videos de YouTube</h2><a id="link-yt" target="_blank" rel="noopener">Ver canal</a></div>
      <div class="rail" id="rail-yt"></div>
    </section>

    <section class="row" id="tiktok">
      <div class="row-head"><h2>Reels de TikTok</h2><a id="link-tt" target="_blank" rel="noopener">Ver perfil</a></div>
      <div class="rail" id="rail-tt"></div>
      <div class="tt-embed" id="tt-embed"></div>
    </section>
    <section class="row about" id="contacto">
      <div class="about-box">
        <h2>Sobre DANY-USH</h2>
        <p id="bio"></p>
        <div class="redes" id="redes"></div>
        <div class="about-actions">
          <a class="btn primary" id="btn-mail" hidden>Marcas y colaboraciones</a>
          <a class="btn" id="btn-donar" target="_blank" rel="noopener" hidden></a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span id="foot-name"></span>
    <div class="foot-links">
      <a id="f-kick" target="_blank" rel="noopener">Kick</a>
      <a id="f-yt" target="_blank" rel="noopener">YouTube</a>
      <a id="f-tt" target="_blank" rel="noopener">TikTok</a>
    </div>
  </footer>

  <dialog id="visor">
    <button class="cerrar" id="cerrar" type="button" aria-label="Cerrar">&times;</button>
    <p class="visor-titulo" id="visor-titulo"></p>
    <div class="marco" id="marco"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
